map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow file uploads up to the platform 50MB cap
    client_max_body_size 50M;

    # HSTS: production only (HTTPS). Conditionally set to avoid breaking dev HTTP.
    # Set HSTS_STS_HEADER env var to "max-age=31536000; includeSubDomains" in production.
    add_header Strict-Transport-Security "${HSTS_STS_HEADER}" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 所有 API 经 Kong 再转发到各后端（与 dev compose 中 KONG_PROXY_URL 一致）
    location /api/ {
        proxy_pass ${KONG_PROXY_URL};
        proxy_http_version 1.1;
        # 必须向 Kong 发送上游主机名，勿传浏览器 Host（如 localhost:3002），否则 Kong 路由会 404
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Activepieces local CDN mirror — icons for every step in the embedded builder.
    # The mirror lives in AP's own publicDir and is served by the AP container; both
    # references to it (the build-time rewrite HERMES-PATCH-009 and the piece metadata
    # logoUrl) are ROOT-absolute `/ap-cdn/...`, so on this origin they land here, not
    # on AP. The embedded builder is a Vite lib-mode bundle, which emits no publicDir,
    # so nothing under /ap-cdn/ exists in this image — without this hop every piece
    # icon 404s into a gray placeholder. Routed via Kong (`activepieces-cdn-route`),
    # the same single backend hop as /api/, so no extra upstream env var is needed.
    location ^~ /ap-cdn/ {
        proxy_pass ${KONG_PROXY_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Immutable mirrored assets: cacheable, unlike the SPA's own /dev/ payloads.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - index.html must not be cached
    location /dev/ {
        try_files $uri $uri/ /dev/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # DEV: do not long-cache hashed chunks — stale immutable JS caused old Send Task UI to stick.
    location ^~ /dev/assets/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ES modules (.mjs) — the ServiceTask builder bundle under /dev/service-task-builder/.
    # nginx's default mime.types has no .mjs entry, so it would fall back to
    # application/octet-stream and the browser refuses to `import()` the module.
    # Empty `types {}` + default_type forces JavaScript for this location only.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets outside /dev/ (hashed filenames, safe to cache long-term)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
