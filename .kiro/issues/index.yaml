- id: "1486"
  status: fixed
  fixed_at: "2026-07-25"
  severity: major
  category: bug
  summary: "Portal To Do sub-table Edit clear field save restores old value via seed merge"
  detail: |
    Root cause: useSubTableRowDialog.handleDialogSave ran mergeFormRowWithSeed(dialogInitialData, rowData) on edit,
    treating empty strings as omitted and restoring the pre-edit snapshot.
    Fix: edit uses { ...seed, ...rowData } (form clears win); add keeps prefer-filled seed merge.
    Verify: SubTableField.assign.test.ts edit save keeps intentionally cleared fields empty.

- id: "1487"
  status: fixed
  fixed_at: "2026-07-25"
  severity: major
  category: bug
  summary: "Portal sub-table Edit clear lookup leaves LookupViewDisplay backfill visible"
  detail: |
    Root cause: SubTableAddDialog listened to LookupField @select but not @clear, so lookupSelectedData
    kept the old row and effectiveLookupSelectedRow still showed LookupViewDisplay.
    Fix: onLookupClear + @clear wiring; effectiveLookupSelectedRow returns null when model is empty
    (stale-cache guard). Parity with FormRenderer handleLookupClear.
    Verify: useSubTableDialogLookup.test.ts (3 cases).

- id: "1488"
  status: fixed
  fixed_at: "2026-07-26"
  severity: major
  category: bug
  summary: "Portal Start/ToDo/Completed missing LOOKUP cascade filters; DW card/subtable cascade incomplete"
  detail: |
    Root cause (Portal): FormRenderer destructured lookupFilterConditionsFor but did not provide it in
    FORM_RENDERER_FIELDS_CTX, so FieldRenderer fell back to static _lookupFilterConditions (no derivedFrom).
    Also initFormData did not seed lookupSelectedData from object-shaped LOOKUP values.
    Root cause (DW): cards without subTable stayed in form-create (LookupComponent had no cascade);
    nested FormPreviewItems isolated selected-row state; subtable list/cells ignored derivedFrom.
    Fix: provide lookupFilterConditionsFor + seed selected rows; extract all cards; shared
    PREVIEW_LOOKUP_CASCADE_KEY; LookupComponent form-create cascade; column derivedFrom + row filters.
    Follow-up: DW LookupBindingSelect now has Admin-parity Allow multiple (lookupConfig.multiple);
    Portal FieldRenderer / extractors / SubTableAddDialog wire _lookupMultiple; LookupPreview multi UI.
    Autofill display: write full row(s) not PK-only; multi init/emit full rows; hydrate omits derived filters.
    Critical: FormRendererFields LookupField missing :multiple/:lookup-config (FieldRenderer had them) so
    multi autofill rendered as single-select and tags showed "-".
    To Do follow-up: LookupField initFromModelValue(null) emitted clear before FormRenderer onMounted
    initFormData, cascade-wiping stage/test_status; also seed after MI isolate + prefer non-empty
    process variables over empty MI row slots.
    DW follow-up: LookupPreview multi init treated full autofill rows as PKs → tag "[object Object]";
    emit/store full rows; cascade writes []/[row] when multiple; Selected Display Field Sample 1.
    DW filter cascade: mock rows stamped filter values onto every row (filter no-op); fixed
    buildLookupPreviewMockRows + ensureMockFields for join columns (code→status_code).
    2026-07-26: Start multi Test_status not persisted — multi LOOKUP skipped handleFieldChange and
    only synced parent via watchThrottled(150ms); ensureMainPrimaryKey/submit read stale parent and
    wrote Flowable null. Fix: syncFormDataToParent + handleLookupModelUpdate; start.vue uses getFormData().
    Assign Task form multiple:false while Start stores array → single init treated Array as row → tag "-".
    Fix: unwrapSingleLookupModelValue in LookupField init.
    2026-07-27 harden: clearLookupSelectionFromModel never emits clear (sync-from-model only clears
    selectedRow/searchKeyword); handleClear still emits for user X. Component tests:
    LookupField.test.ts — empty init no clear; async hydrate shows "Developer Tester".
    Verify: useFormDataLookupMultiSync.test.ts; _verify-lookup-multi-persist-todo.mjs; To Do tag "A llll".
    screenshots:
      frontend/user-portal/verification-screenshots/2026-07-25_lookup-cascade-autofill-test-status.png
      frontend/user-portal/verification-screenshots/2026-07-25_lookup-cascade-autofill-todo.png
      frontend/user-portal/verification-screenshots/2026-07-26_lookup-multi-persist-todo.png
      frontend/developer-workstation/verification-screenshots/2026-07-25_lookup-cascade-autofill-display-dw.png
      frontend/developer-workstation/verification-screenshots/2026-07-26_lookup-filter-cascade-dw-dropdown.png

- id: "1489"
  status: fixed
  fixed_at: "2026-07-27"
  severity: major
  category: bug
  summary: "MI SubProcess 内 Send Task deploy 失败：cvc-id.2 duplicate ID"
  file: "backend/workflow-engine-core/src/main/java/com/workflow/component/ProcessDeploymentManager.java"
  note: |
    现象：Process Design 在 Multi-Instance Sub-Process 内添加 Send Task 后 Deploy 停在
    deploy.step.validate / deploy.validate_failed（MI 校验已通过）。
    根因：bindSendEmailTasks 用 process.findFlowElementsOfType(..., true) 找到嵌套 SendTask，
    却对 Process 根做 remove/add，子流程内原 SendTask 未移除，根上又写入同 ID ServiceTask，
    Flowable dry-run 报 cvc-id.2 multiple occurrences of ID（如 Activity_00auiyo）。
    修复：按所属 FlowElementsContainer（SubProcess/Process）原地替换；单测覆盖 MI 嵌套场景。
    关联：#1462（顶层 SendTask 转换）。验证：ProcessDeploymentManagerSendEmailTest 2/2 pass；
    workflow-engine compose rebuild。

- id: "1490"
  status: fixed
  fixed_at: "2026-07-27"
  severity: major
  category: bug
  summary: "DW 保存 Outbound 邮件连接 toast「name resolution failed」（Kong 上游 DNS 缓存）"
  file: "deploy/environments/dev/docker-compose.dev.yml"
  note: |
    现象：Edit Connection → Save 出现英文 name resolution failed，与 QQ/SMTP 配置无关。
    根因：Kong 日志 PUT /api/v1/function-units/48/connections/4 在 developer-workstation
    容器重建期间无法刷新 developer-workstation DNS（stale upstream IP）。
    修复：KONG_DNS_STALE_TTL/NOT_FOUND/ERROR_TTL=0/1；build-and-deploy 后端部署后 restart kong；
    前端映射 gatewayUpstreamUnavailable；已 restart kong 恢复。

- id: "1491"
  status: fixed
  fixed_at: "2026-07-27"
  severity: major
  category: bug
  summary: "MI SubProcess 内 Send Email 报 EMAIL_SEND_FAILED（FlowElement 解析失败）"
  file: "backend/workflow-engine-core/src/main/java/com/workflow/delegate/SendEmailTaskDelegate.java"
  note: |
    现象：case 8ff53852… 在 MI SubProcess 完成任务后 SendEmailTaskDelegate 立即失败，
    Flowable 报 No catching boundary event for errorCode EMAIL_SEND_FAILED。
    根因：getFlowElement 仅用 bpmnModel.getMainProcess().getFlowElement()，
    嵌套在 SubProcess 内的 Activity_00auiyo 查不到 → 误判 flow element unresolved 并抛 BpmnError。
    修复：改用 bpmnModel.getFlowElement()（与 TaskAssignmentListener 等一致）；
    单测 SendEmailTaskDelegateFlowElementTest。验证：mvn test SendEmailTaskDelegateFlowElementTest pass；
    workflow-engine compose rebuild + kong restart。

- id: "1492"
  status: fixed
  fixed_at: "2026-07-27"
  severity: major
  category: bug
  summary: "Send Email 拉模板用 Admin UUID 导致 EMAIL_CONFIG_INVALID（DW 400）"
  file: "backend/workflow-engine-core/src/main/java/com/workflow/delegate/SendEmailTaskDelegate.java"
  note: |
    现象：FlowElement 修复后仍报 EMAIL_CONFIG_INVALID / no catching boundary。
    根因：引擎用 process.functionUnitId（Admin UUID）调 DW
    /internal/function-units/{id}/email-templates/{tid}，DW PathVariable 为 Long → 400
    MethodArgumentTypeMismatchException；模板实际在 DW FU 48 / code fu-20260505-thwmut。
    修复：SendEmail 模板查询优先 functionUnitCode；DW InternalEmailTemplateController
    支持 numeric id 或 code。验证：相关单测 pass；rebuild workflow-engine + DW + kong。

