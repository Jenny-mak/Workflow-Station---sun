  category: bug
  summary: "Admin Center UAT 启动后绑定 Hikari pool-name 触发不可变属性异常"
  file: "backend/admin-center/src/main/resources/application.yml"
  note: |
    现象：UAT 启动路径中 Hikari 连接池可能已初始化，再绑定
    spring.datasource.hikari.pool-name 会尝试修改不可变属性，导致启动异常。
    根因：application.yml 显式设置 pool-name: AdminCenterHikariPool，与池已创建后的
    晚绑定冲突。
    修复：删除显式 pool-name，创建时采用 Hikari 默认池名称；不改动 maximum-pool-size /
    timeout 等运行参数。
    验证：
      - 产物 jar 内 application.yml 无 pool-name / AdminCenterHikariPool
      - 本地：mvn -pl backend/admin-center -am package -DskipTests；
        docker compose build --no-cache admin-center && up -d；
        容器 healthy；日志 Started AdminCenterApplication，无 Hikari 不可变属性/pool-name 报错
      - UAT：构建 → 镜像部署 → rollout → 服务正常启动（同路径验收）
    关联未修：#1496（启动诊断未关 JDBC 连接）。

