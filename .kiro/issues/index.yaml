- id: "1531"
  status: open
  severity: minor
  category: quality
  summary: "Form Business Rules 为未交付的半成品脚手架：DW 无编辑器入口、Portal config prop 无人传入、mathjs 运行时不可达（技术债，非线上缺陷）"
  file: "frontend/user-portal/src/components/FormRenderer.vue"
  note: |
    原拟编号 #1519，但该 id 已被 PR #106（form-below-table Events）占用，故改为 #1531。
    发现于计算字段特性开发（批次 4 范围确认）时的旁路审查。**不是线上缺陷**——
    该能力从未上线，用户配不出、数据里没有、运行时也跑不到。仅作技术债留档。
    三层证据：
      1) DW 无入口：formBusinessLogicTypes.ts 里 FormulaRule / RowFormulaRule /
         LinkageRule / CrossFieldRule / SummaryRule 无任何组件 import（只有
         ConditionExpression / ValidationRule / SubTableValidationConfig 被
         ActionDesigner / ValidationRuleList / ConditionBuilder 等实际使用）；
         i18n 里 `// FormulaEditor` `// RowFormulaEditor` 段落的文案没有对应组件。
      2) Portal 无传参：FormRenderer 声明 config?: FormBusinessLogicConfig（L116），
         useFormData 的 config()（L247/270/277/285）驱动 BusinessLogicEngine、
         getSubFormRowFormulas、summaryRules、子表校验——但全仓没有任何调用方给
         FormRenderer 传 :config（唯一 :config= 是 RecordNote 的 _recordNote；
         三个视图传的 :form-config 是另一个 prop；portal src 内无 v-bind 展开）。
         故上述四类规则同时恒为 undefined，evaluateFormula / mathjs 仅单测触达。
      3) 数据为空：dev 库 dw_form_definitions 共 20 条，config_json 含
         formulas / rowFormulas / summaryRules / linkages / crossFieldRules 的
         各为 0 条（2026-08-17 实测）。
    唯一理论产生路径：useAiTemplates.ts L30 的 dataEntry 模板 prompt 要求 AI 生成
    formulas / linkages / summaryRules，而 AiWriteServiceImpl L407-430 把 configJson
    整体持久化，故 AI 有可能写入这些字段并被静默忽略。实测未发生。
    处置：日后若真要做表单业务规则，作为新特性单独立项（届时应直接采用
    frontend/shared/src/computedField 共享 AST 引擎，不要复活 mathjs）；
    或反向清理脚手架（删 businessLogicEngine 死代码 + 卸 mathjs + 清 i18n 文案）。
    与计算字段特性无关，不阻塞其交付。

