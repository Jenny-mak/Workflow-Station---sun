# =====================================================
# Development Environment - Docker Compose
# =====================================================
# Local Docker Desktop only. Infrastructure (PG, Redis) runs locally.
# SIT/UAT/PROD use company K8S — see deploy/k8s/
# developer-workstation（设计器）仅 DEV 使用；K8S 部署脚本已不包含该服务，勿将设计器发布到 SIT/UAT/PROD。
#
# IMPORTANT: Full local stack MUST be built/started via:
#   .\build-and-deploy.ps1
# That script does incremental Maven/Vite/Docker builds, waits for Postgres init
# (PID 1 = postgres), applies content-hashed schema migrations, and fails closed
# on missing SUPERSET_DATABASE_URI / Superset init errors.
#
# All images use "local build + copy" (no Docker multi-stage). Raw
# `docker compose up --build` skips those gates and may race Postgres init or
# miss BuildKit pip secrets for Superset — prefer the deploy script.
#
# Demo / 演示约定：界面与种子数据以英文为准（无单独的 LOCALE 环境变量；
# 前端语言在 frontend/*/src/i18n/index.ts 固定为 en，需改语言请改源码后重建镜像）。
# 详见仓库根目录 BUILD_GUIDE.md §2.5 与 docs/demo-data-requirements.md。
# =====================================================

services:
  # ==================== Infrastructure ====================

  # PostgreSQL Database
  postgres:
    image: postgres:16.5-alpine
    container_name: platform-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../../../deploy/init-scripts:/docker-entrypoint-initdb.d:ro
      # Flowable 的官方建表/升级 SQL 单独挂进来（而不是复制一份到 init-scripts）：
      # 同一份 SQL 在仓库里存两处，升 Flowable 版本时必然漏改其中一处。
      # 挂在 initdb.d 之外，由 00-init-all.sh 显式按顺序调用。
      - ../../../deploy/k8s/init-data/init-flowable:/flowable-sql:ro
    healthcheck:
      # Require PID 1 to be the real postgres server, not a temporary init process that
      # can still answer pg_isready while docker-entrypoint-initdb.d is mid-flight.
      # Otherwise host-side schema migrations race the container init scripts on first boot.
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - platform-dev-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: platform-redis-dev
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-dev-network

  # Kafka (KRaft mode - no ZooKeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: platform-kafka-dev
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      # Bound the JVM heap so Kafka can't balloon and get OOM-killed on the small dev VM.
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - platform-dev-network

  # Activepieces (workflow automation, community edition).
  # Non-prod: UI login via the edge gateway shared-account (see nginx :8085 + bridge).
  # Shares the platform Postgres/Redis. Runs the engine + UI + API on container :80.
  activepieces:
    # HERMES vendored image: EE-removed + de-bunned Activepieces 0.88.0, built from the
    # in-repo source tree (automation/) via its own Dockerfile. EE is stripped (AG-EE),
    # bun is gone (X-4, pnpm/Node), the Approvals tab is patched out at the source level
    # (HERMES-PATCH-001, Q9), and the allowlisted pieces (automation/hermes/pieces.json)
    # are PRE-INSTALLED by the last layer — the runtime installer is a no-op for them, so
    # an air-gapped cluster never reaches a registry. Custom (ARCHIVE) pieces imported via
    # the retained admin-center service resolve from the baked pnpm offline store instead.
    # The 0.84 predecessor tree was DELETED on 2026-08-14 once 0.88 was verified; retrieve it
    # from git history if ever needed (`git show de4f6469:activepieces/<path>`).
    # Build (heavy — full monorepo): docker compose build activepieces
    build:
      context: ../../../automation
      dockerfile: Dockerfile
    image: activepieces:0.88.0-ee-removed
    container_name: platform-activepieces-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No host port: the AP native login (non-shared-account) must not be reachable
    # directly. The ONLY browser entry is the :8085 edge gateway (shared-account
    # bridge). In-network AP is reachable as activepieces:80 (edge + admin-center).
    # The shared account lives in the shared Postgres, so it survives this port being
    # closed. EMERGENCY raw-UI access (e.g. create users / reset the owner password):
    # uncomment the ports block below, `docker compose up -d activepieces`, then re-close.
    expose:
      - "80"
    # ports:
    #   - "${ACTIVEPIECES_PORT:-8086}:80"   # raw AP UI — keep DISABLED outside emergencies
    # >>> SANDBOX BASELINE — decision D6 (2026-07-23). NOT an experiment; do not remove. <<<
    # See docs/ap-integration/DECISIONS.md#d6.
    # SYS_ADMIN was deliberately NOT granted: security policy forbids privilege
    # escalation, and it conflicts with K8s Pod Security Standards `restricted`.
    # That rules out isolate(1) process sandboxing (it needs SYS_ADMIN to clone()
    # namespaces — otherwise every run dies with "Cannot run proxy, clone failed"),
    # so the baseline drops to SANDBOX_CODE_ONLY.
    # NET_ADMIN is kept for parity with production, but is currently INERT: the
    # iptables owner-uid egress chain (AP_EGRESS_LOCKDOWN) is only installed in the
    # isolate process-sandbox modes. Verified 2026-07-23: OUTPUT policy ACCEPT, no
    # AP_EGRESS_LOCKDOWN chain, all processes uid=0, raw socket reaches admin-center.
    # Only the app-layer egress proxy survives (piece HTTP to internal targets → 403).
    # Residual exposure is PIECE code (in-process, can bypass the proxy), NOT CODE
    # steps (isolated-vm has no network primitives). Compensating controls C-1
    # (NetworkPolicy) and C-3 (drop bare X-User-Id at the bridge) are REQUIRED before
    # production and are not yet implemented.
    cap_add:
      - NET_ADMIN
    environment:
      # 0.84 ships UNSANDBOXED + UNRESTRICTED (neither layer isolates, no egress limits).
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_NETWORK_MODE: STRICT
    # <<< SANDBOX BASELINE (D6) >>>
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_DATABASE: ${POSTGRES_DB:-workflow_platform_dev}
      AP_POSTGRES_USERNAME: ${POSTGRES_USER:-platform_dev}
      AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: 6379
      AP_REDIS_PASSWORD: ${REDIS_PASSWORD}
      AP_ENCRYPTION_KEY: ${ACTIVEPIECES_ENCRYPTION_KEY:-dev-activepieces-key-change-me}
      AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET:-dev-ap-jwt-secret-change-me}
      AP_FRONTEND_URL: ${ACTIVEPIECES_FRONTEND_URL:-http://localhost:8085/}
      AP_WEBHOOK_URL: ${ACTIVEPIECES_WEBHOOK_URL:-http://localhost:8085/}
      # HERMES-PATCH-031: 容器内回拉 piece bundle 用的地址(仅此一处用它)。
      # 上面两个是**浏览器视角**的地址;而 ARCHIVE 件安装时 worker 在容器内 fetch
      # /v1/engine/pieces/bundle,用浏览器地址会打到容器自己的 8085(无监听)=> fetch failed
      # => Admin Center 的 Import Piece 必然 500。webhook 仍用对外地址,不受影响。
      AP_INTERNAL_API_URL: ${ACTIVEPIECES_SELF_INTERNAL_URL:-http://localhost:80}
      AP_TRIGGER_DEFAULT_POLL_INTERVAL: 1
      AP_ENVIRONMENT: prod
      # Sync-webhook wait (AP default 30s → 204 No Content on slow flows). Kept at 300s for
      # long-running service-task flows. (AI Generate no longer runs on AP — since 2026-07-29
      # DW calls the group AI gateway directly, so this no longer pairs with a DW timeout.)
      AP_WEBHOOK_TIMEOUT_SECONDS: ${ACTIVEPIECES_WEBHOOK_TIMEOUT_SECONDS:-300}
      # Silence AP's PostHog product telemetry (floods the browser console / gets rate-limited).
      AP_TELEMETRY_ENABLED: "false"
      # No-external-download policy (mirrors deploy/k8s/activepieces.yaml): piece catalog
      # comes ONLY from the piece_metadata table — no cloud.activepieces.com sync, no
      # public-npm installs, no cloud OAuth2 apps. Pieces must be provisioned internally,
      # so a fresh rebuild starts with an EMPTY piece catalog.
      # NOTE: AP 0.84.0 has no AP_PIECES_SOURCE variable (verified by full-repo grep);
      # the offline switch that actually works is SYNC_MODE=NONE, which makes
      # piece-sync-service skip the cloud metadata sync (default OFFICIAL_AUTO
      # re-downloads piece metadata from cloud.activepieces.com into the DB).
      # C-2 piece 冻结 + X-3 气隙：这两条与镜像内的代码默认值一致（HERMES-PATCH-019 已把上游
      # 的 OFFICIAL_AUTO / true 翻成 fail-closed），此处显式重写一遍，让运维在 compose 里就能
      # 看见闸门的位置，而不是要去读镜像里的默认值。改动任一条都等于允许运行期出公网。
      AP_PIECES_SYNC_MODE: NONE
      AP_USE_CDN_FOR_BUNDLES: "false"
      AP_CLOUD_AUTH_ENABLED: "false"
      # Runtime piece installs run pnpm (bun removed, X-4), which honors NPM_CONFIG_REGISTRY
      # the same way. Empty (dev default) = pnpm's own default, i.e. PUBLIC npmjs —
      # acceptable on local dev only (the piece catalog is empty anyway); k8s deliberately
      # keeps a fail-closed .invalid value. Set this to the internal Nexus npm repo URL to
      # rehearse provisioning against a private mirror.
      NPM_CONFIG_REGISTRY: ${ACTIVEPIECES_NPM_REGISTRY:-}
      # HERMES piece-admin P3: true = runtime piece installs resolve ONLY from the
      # pnpm offline store baked into the image (framework closure) — the air-gap
      # posture. Dev default false so REGISTRY whitelist pieces still install from
      # public npm on demand; flip to true to rehearse the air-gapped path locally.
      AP_PIECES_OFFLINE_INSTALL: ${AP_PIECES_OFFLINE_INSTALL:-false}
      # STRICT mode runs an egress proxy that blocks every private IP, including our own
      # services — so a flow could not fetch the uploaded file the engine hands it
      # (FILE_SERVICE_BASE_URL -> http://developer-workstation:8080/api/v1/upload/files/...).
      # The sandbox got "403 Egress blocked: developer-workstation" and the flow died at the
      # HTTP step. Entries are IPs or CIDRs only (matched against RESOLVED addresses — a
      # hostname here would never match); empty = fail-closed. See docs/ap-integration D9-4.
      AP_SSRF_ALLOW_LIST: ${AP_SSRF_ALLOW_LIST:-}
    volumes:
      - activepieces_data:/app/packages/server/data
    healthcheck:
      # The AP image ships neither wget nor curl, but always has node — probe with it.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:80/api/v1/flags',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - platform-dev-network
    restart: unless-stopped

  # Superset BI
  superset-final:
    build:
      context: ../../superset
      dockerfile: Dockerfile
      # BuildKit secret: pip.conf (Nexus/PyPI) — never bake credentials into image layers.
      # Prefer .\build-and-deploy.ps1 which resolves SUPERSET_PIP_CONF_FILE; raw compose
      # build requires that env var to point at a readable pip.conf.
      secrets:
        - pip_conf
    image: dev-superset
    container_name: platform-superset-dev
    depends_on:
      postgres:
        condition: service_healthy
    # No host port: raw Superset (:8088) is NOT browser-reachable. It trusts
    # X-Remote-* for REMOTE_USER auth, so it must only be reached via the edge under
    # /bi (author gate on /bi/login/, ungated embed elsewhere). In-network: superset-final:8088.
    expose:
      - "8088"
    environment:
      # Fail-closed DB URI (no compose-interpolated password fallback in config code).
      # Injected from local .env / K8s Secret. Must be postgresql+psycopg2://…
      SUPERSET_DATABASE_URI: ${SUPERSET_DATABASE_URI:?SUPERSET_DATABASE_URI is required}
      SUPERSET_DB_SCHEMA: ${SUPERSET_DB_SCHEMA:-superset}
      # No insecure default: superset_config.py fails closed if this is unset (see .env).
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SUPERSET_CORS_ORIGINS: ${SUPERSET_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Served under /bi on the shared FQDN: Superset 6.0 reads SUPERSET_APP_ROOT natively
      # (-> APPLICATION_ROOT) so routes/assets/redirects carry the /bi prefix.
      SUPERSET_APP_ROOT: ${SUPERSET_APP_ROOT:-/bi}
    # Persist superset_home. The `load_examples` sample DATA lands in a SQLite file
    # here (SQLALCHEMY_EXAMPLES_URI = sqlite:////app/superset_home/examples.db); without
    # a volume every container rebuild wipes it, so charts whose definitions live in the
    # (persistent) Postgres metadata then fail with "no such table" until you reload.
    # A named volume keeps examples.db across rebuilds — run `superset load_examples` once.
    volumes:
      - superset_home:/app/superset_home
    healthcheck:
      # This superset:6.0.0 image has no wget/curl — use the bundled venv python.
      # The probe path must carry SUPERSET_APP_ROOT: Superset mounts the WHOLE app under
      # APPLICATION_ROOT, so with /bi the health endpoint is /bi/health and a hardcoded
      # /health 404s forever — container reads "unhealthy" while Superset is perfectly fine.
      # Read the env inside python (not the shell) so an empty APP_ROOT degrades to /health.
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import os,urllib.request,sys; root=os.environ.get('SUPERSET_APP_ROOT','').rstrip('/'); sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088'+root+'/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - platform-dev-network
    restart: unless-stopped

  # ==================== Backend Services ====================

  # Workflow Engine Core
  workflow-engine:
    build:
      context: ../../../backend/workflow-engine-core
      dockerfile: Dockerfile
    image: dev-workflow-engine
    container_name: platform-workflow-engine-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${WORKFLOW_ENGINE_PORT}:8080"
    volumes:
      - ./logs:/app/logs
      - ../../../.cursor:/.cursor-debug
    environment:
      DEBUG_LOG_PATH: /.cursor-debug/debug-8aa4e2.log
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      # 与 sit/preprod/uat/prod 一致：引擎只校验版本，不建表也不升级。
      # act_* 由 postgres 初始化时的 00-init-all.sh Step 0 建好（官方 create + 三个 upgradestep），
      # 所以空卷重建照样能起来；而将来有人改了 pom.xml 里的 flowable.version 却没迁库时，
      # 引擎会直接拒绝启动，不会把库静默迁移掉 —— 单向迁移必须是人工、备份后的决定。
      FLOWABLE_SCHEMA_UPDATE: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_CENTER_URL: http://admin-center:8080
      USER_PORTAL_URL: http://user-portal:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PORTAL_INTERNAL_API_TOKEN: ${PORTAL_INTERNAL_API_TOKEN:-dev-portal-internal-token-change-me}
      # Q7 部署期 flowId 解析：引擎凭 C-3 共享密钥调 admin-center /automation/flows/resolve
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:-dev-service-internal-token-change-me}
      # 本地测试账号（仅 dev；生产/K8s 严禁设置，代码默认 fail-closed）
      WORKFLOW_TEST_USERS_ENABLED: ${WORKFLOW_TEST_USERS_ENABLED:-true}
      WORKFLOW_TEST_USERS: ${WORKFLOW_TEST_USERS:-admin:admin123,user:user123}
    networks:
      - platform-dev-network
    restart: unless-stopped

  # Admin Center Backend
  admin-center:
    build:
      context: ../../../backend/admin-center
      dockerfile: Dockerfile
    image: dev-admin-center
    container_name: platform-admin-center-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      workflow-engine:
        condition: service_healthy
      superset-final:
        condition: service_started
    ports:
      - "${ADMIN_CENTER_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 与 user-portal / developer-workstation 一致指向网内 broker；缺省回退 localhost:9092
      # 在容器内无法解析 → "No resolvable bootstrap urls" 启动失败。
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WORKFLOW_ENGINE_URL: http://workflow-engine:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SPRING_FLYWAY_ENABLED: "false"
      SSO_INTERNAL_TOKEN: ${SSO_INTERNAL_TOKEN:-dev-sso-internal-token-change-me}
      # C-3 (DECISIONS.md#d6): 可信服务密钥；admin-center 凭此校验裸 X-User-Id。AP 服务不得配置此项。
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:-dev-service-internal-token-change-me}
      # 默认与 edge-frontend（EDGE_FRONTEND_PORT）单源路径一致；直连前端端口时见 application.yml 额外前缀
      SSO_REDIRECT_ADMIN_PREFIX: ${SSO_REDIRECT_ADMIN_PREFIX:-http://localhost:3000/admin/sso/callback}
      SSO_REDIRECT_ADMIN_HTTP_PREFIX: ${SSO_REDIRECT_ADMIN_HTTP_PREFIX:-http://localhost:3000/admin/sso/callback}
      SSO_REDIRECT_PORTAL_PREFIX: ${SSO_REDIRECT_PORTAL_PREFIX:-http://localhost:3000/portal/sso/callback}
      SSO_REDIRECT_PORTAL_HTTP_PREFIX: ${SSO_REDIRECT_PORTAL_HTTP_PREFIX:-http://localhost:3000/portal/sso/callback}
      SSO_REDIRECT_DW_PREFIX: ${SSO_REDIRECT_DW_PREFIX:-http://localhost:3000/dev/sso/callback}
      SSO_REDIRECT_DW_HTTP_PREFIX: ${SSO_REDIRECT_DW_HTTP_PREFIX:-http://localhost:3000/dev/sso/callback}
      SUPERSET_HOST: ${SUPERSET_HOST:-http://superset-final:8088/bi}
      # Browser-facing base URL returned to the portal for embedding iframes. Under the
      # single-FQDN model this is the /bi subpath on the shared origin; the embedded SDK
      # builds `${supersetDomain}/embedded/<id>` -> http://localhost:3000/bi/embedded/<id>.
      SUPERSET_PUBLIC_HOST: ${SUPERSET_PUBLIC_HOST:-http://localhost:3000/bi}
      # After /auth/logout-redirect clears the cookie, land on a WORKING login page
      # (with SSO params, else it can't submit). Relative path -> resolved against the
      # host the browser used. redirect_uri is percent-encoded; state=superset-author
      # makes re-login flow straight back into Superset.
      APP_SECURITY_LOGOUT_REDIRECT_TARGET: "/login/?client_id=admin&redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Fadmin%2Fsso%2Fcallback&state=superset-author"
      SUPERSET_DB_SCHEMA: ${SUPERSET_DB_SCHEMA}
      BI_SUPERSET_USERNAME: ${BI_SUPERSET_USERNAME}
      BI_SUPERSET_PASSWORD: ${BI_SUPERSET_PASSWORD}
      # Activepieces login bridge (non-prod): mint per-user AP tokens.
      # In-network AP is activepieces:80. Prod runtime leaves bridge disabled (no UI).
      ACTIVEPIECES_INTERNAL_URL: ${ACTIVEPIECES_INTERNAL_URL:-http://activepieces:80}
      ACTIVEPIECES_BRIDGE_ENABLED: ${ACTIVEPIECES_BRIDGE_ENABLED:-true}
      # L7 per-user provisioning（审计到人）——AP 身份的唯一路径，无共享账号、无开关：
      # 每次 AP 调用按当前操作人换 token，flow Owner 与 AP 审计落真实的人。
      # 密钥对来自一次性 POST /v1/signing-keys；私钥仅服务端持有（.env，单行 PEM）。
      ACTIVEPIECES_MANAGED_SIGNING_KEY_ID: ${ACTIVEPIECES_MANAGED_SIGNING_KEY_ID:-}
      ACTIVEPIECES_MANAGED_PRIVATE_KEY: ${ACTIVEPIECES_MANAGED_PRIVATE_KEY:-}
      ACTIVEPIECES_MANAGED_PROJECT_EXTERNAL_ID: ${ACTIVEPIECES_MANAGED_PROJECT_EXTERNAL_ID:-hermes-main}
      # 影子用户角色（平台级 ADMIN|MEMBER / project 级 Admin|Editor|Viewer）。默认全权：
      # 从 admin center 进入的人要能用 AP 平台级页面。每次握手同步既有影子用户。
      ACTIVEPIECES_MANAGED_PLATFORM_ROLE: ${ACTIVEPIECES_MANAGED_PLATFORM_ROLE:-ADMIN}
      ACTIVEPIECES_MANAGED_PROJECT_ROLE: ${ACTIVEPIECES_MANAGED_PROJECT_ROLE:-Admin}
      # 桥页公网地址（浏览器侧）。/launch 在其后附 #nonce=<票> 整页跳转（方案 B 跨域 SSO 握手）。
      # dev 同源 :8085；k8s 经 configmap AP_BRIDGE_URL 注入 AP 网关主机。
      AP_BRIDGE_URL: ${ACTIVEPIECES_BRIDGE_PUBLIC_URL:-http://localhost:8085/__ap/bridge}
      # AgentNdjsonLog：与下方 volumes 的 /app/logs 对齐，宿主机见 deploy/environments/dev/logs/debug-864cd4.log
      WORKFLOW_DEBUG_NDJSON_PATH: ${WORKFLOW_DEBUG_NDJSON_PATH:-/app/logs/debug-864cd4.log}
      # LDAP / SSO-DSP (local mock) — env 名须与 application.yml 中 ${LDAP_*} 一致
      LDAP_ENABLED: ${LDAP_ENABLED:-true}
      LDAP_PROVIDER_URL: ${LDAP_PROVIDER_URL:-ldap://test-ldap:389}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=example,dc=org}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-cn=admin,dc=example,dc=org}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-admin}
      LDAP_TLS: ${LDAP_TLS:-false}
      # 本地 mock OpenLDAP 无 TLS：显式允许明文（生产/K8s 默认 false，明文配置会启动 fail-fast）
      LDAP_ALLOW_INSECURE: ${LDAP_ALLOW_INSECURE:-true}
      LDAP_CONNECT_TIMEOUT_MS: ${LDAP_CONNECT_TIMEOUT_MS:-5000}
      LDAP_READ_TIMEOUT_MS: ${LDAP_READ_TIMEOUT_MS:-10000}
      LDAP_PAGE_SIZE: ${LDAP_PAGE_SIZE:-500}
      LDAP_MAX_ENTRIES: ${LDAP_MAX_ENTRIES:-0}
      LDAP_USER_SEARCH_FILTER: ${LDAP_USER_SEARCH_FILTER:-(objectclass=inetOrgPerson)}
      LDAP_SYNC_ENABLED: ${LDAP_SYNC_ENABLED:-true}
      LDAP_SYNC_CRON: ${LDAP_SYNC_CRON:-0 0 */2 * * ?}
      LDAP_KEYSTORE_PATH: ${LDAP_KEYSTORE_PATH:-}
      LDAP_KEYSTORE_PASSWORD: ${LDAP_KEYSTORE_PASSWORD:-}
      LDAP_ATTR_EMPLOYEE_ID: ${LDAP_ATTR_EMPLOYEE_ID:-employeeNumber}
      LDAP_ATTR_UID: ${LDAP_ATTR_UID:-uid}
      LDAP_ATTR_SAM_ACCOUNT_NAME: ${LDAP_ATTR_SAM_ACCOUNT_NAME:-uid}
      LDAP_ATTR_DISPLAY_NAME: ${LDAP_ATTR_DISPLAY_NAME:-displayName}
      LDAP_ATTR_MAIL: ${LDAP_ATTR_MAIL:-mail}
      LDAP_ATTR_TELEPHONE: ${LDAP_ATTR_TELEPHONE:-telephoneNumber}
      LDAP_ATTR_TITLE: ${LDAP_ATTR_TITLE:-title}
      LDAP_ATTR_LINE_MANAGER_NAME: ${LDAP_ATTR_LINE_MANAGER_NAME:-hsbc-ad-LineManagerName}
      LDAP_ATTR_AUTH_MANAGER_NAME: ${LDAP_ATTR_AUTH_MANAGER_NAME:-hsbc-ad-AuthManagerName}
      LDAP_ATTR_LINE_MANAGER_ID: ${LDAP_ATTR_LINE_MANAGER_ID:-manager}
      # Hermes AD 组同步（本地 mock 使用 test-ldap 组名）
      LDAP_HERMES_ENV: ${LDAP_HERMES_ENV:-DEV}
      LDAP_GROUP_SEARCH_BASE_DN: ${LDAP_GROUP_SEARCH_BASE_DN:-dc=example,dc=org}
      LDAP_HERMES_GROUP_SYNC_GROUPS: ${LDAP_HERMES_GROUP_SYNC_GROUPS:-}
      LDAP_HERMES_GROUP_SYNC_ROLES: ${LDAP_HERMES_GROUP_SYNC_ROLES:-Admin,User,Developer}
      LDAP_HERMES_GROUP_SYNC_PATTERN: ${LDAP_HERMES_GROUP_SYNC_PATTERN:-Hermes-Dev-{env}-{role}}
      LDAP_HERMES_GROUP_SYNC_BATCH_SIZE: ${LDAP_HERMES_GROUP_SYNC_BATCH_SIZE:-20}
      # DSP SSO (local mock)
      DSP_SSO_ENABLED: ${DSP_SSO_ENABLED:-true}
      DSP_AUTHENTICATE_URL: ${DSP_AUTHENTICATE_URL:-}
      DSP_TRANSLATOR_URL: ${DSP_TRANSLATOR_URL:-http://mock-dsp:9099/translator}
      DSP_CLIENT_ID: ${DSP_CLIENT_ID:-dev-dsp-client}
      DSP_CLIENT_SECRET: ${DSP_CLIENT_SECRET:-dev-dsp-secret}
      DSP_EMPLOYEE_ID_CLAIMS: ${DSP_EMPLOYEE_ID_CLAIMS:-employeeID,employeeNumber,sub}
      DSP_USERNAME_CLAIMS: ${DSP_USERNAME_CLAIMS:-uid,preferred_username,sub}
      ADMIN_DEV_BYPASS_ROLE_CHECK: ${ADMIN_DEV_BYPASS_ROLE_CHECK:-true}
      # Cross-service portal audit / runtime purge (must match user-portal portal.internal.api-token)
      USER_PORTAL_BASE_URL: ${USER_PORTAL_BASE_URL:-http://user-portal:8080/api/portal}
      PORTAL_INTERNAL_API_TOKEN: ${PORTAL_INTERNAL_API_TOKEN:-dev-portal-internal-token-change-me}
    volumes:
      - ./logs:/app/logs
      - ./certs/ldap-prod.jks:/app/ldap-prod.jks:ro
    networks:
      - platform-dev-network
    restart: unless-stopped

  # User Portal Backend
  user-portal:
    build:
      context: ../../../backend/user-portal
      dockerfile: Dockerfile
    image: dev-user-portal
    container_name: platform-user-portal-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      workflow-engine:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${USER_PORTAL_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_CENTER_URL: http://admin-center:8080
      WORKFLOW_ENGINE_URL: http://workflow-engine:8080
      DEVELOPER_WORKSTATION_URL: ${DEVELOPER_WORKSTATION_URL:-http://developer-workstation:8080}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SPRING_FLYWAY_ENABLED: false
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SSO_INTERNAL_TOKEN: ${SSO_INTERNAL_TOKEN:-dev-sso-internal-token-change-me}
      PORTAL_INTERNAL_API_TOKEN: ${PORTAL_INTERNAL_API_TOKEN:-dev-portal-internal-token-change-me}
      # C-3 (DECISIONS.md#d6): 可信服务密钥；调用 admin-center 时附带，使其信任转发的 X-User-Id。
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:-dev-service-internal-token-change-me}
    volumes:
      - ./logs:/app/logs
    networks:
      - platform-dev-network
    restart: unless-stopped

  # Developer Workstation Backend
  developer-workstation:
    build:
      context: ../../../backend/developer-workstation
      dockerfile: Dockerfile
    image: dev-developer-workstation
    container_name: platform-developer-workstation-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      workflow-engine:
        condition: service_healthy
    ports:
      - "${DEVELOPER_WORKSTATION_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_CENTER_URL: http://admin-center:8080
      WORKFLOW_ENGINE_URL: http://workflow-engine:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SPRING_FLYWAY_ENABLED: false
      SSO_INTERNAL_TOKEN: ${SSO_INTERNAL_TOKEN:-dev-sso-internal-token-change-me}
      # C-3 (DECISIONS.md#d6): 可信服务密钥；调用 admin-center 时附带，使其信任转发的 X-User-Id。
      SERVICE_INTERNAL_TOKEN: ${SERVICE_INTERNAL_TOKEN:-dev-service-internal-token-change-me}
      FILE_UPLOAD_BASE_URL: /api/v1/upload/files
      # 进程内限流默认关闭：限流由 Kong 统一负责（本服务流量都经 Kong）。仅在 DW 绕过 Kong 暴露时打开。
      DW_RATE_LIMIT_ENABLED: ${DW_RATE_LIMIT_ENABLED:-false}
      DW_RATE_LIMIT_PER_MINUTE: ${DW_RATE_LIMIT_PER_MINUTE:-600}
      # AI Generate 直连集团 AI gateway(OpenAI 兼容 chat/completions),凭证是每用户的 DSP AMToken。
      # 空值 => 每轮对话以 AI_GATEWAY_NOT_CONFIGURED 失败(不静默降级);dev 默认取 .env 里的 AI 平台地址。
      AI_GENERATION_ENABLED: ${AI_GENERATION_ENABLED:-true}
      GROUP_AI_GATEWAY_URL: ${GROUP_AI_GATEWAY_URL:-}
      AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-}
      # SSE 流式(服务端拼回整段)。DeepSeek 这类会掐长连接的端点必须开;集团 gateway 保持 false。
      AI_GATEWAY_STREAM: ${AI_GATEWAY_STREAM:-false}
      # 静态 Bearer key(本地自测直连 DeepSeek 等 OpenAI 兼容端点用)。非空即顶掉每用户 AMToken,
      # 审计不到人 => dev 之外留空。
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_GATEWAY_TIMEOUT_SECONDS: ${AI_GATEWAY_TIMEOUT_SECONDS:-300}
      # SMTP/IMAP connection test + AI gateway: allow hostnames that resolve to private IPs on corp VPN.
      SSRF_ALLOWED_HOSTS: ${SSRF_ALLOWED_HOSTS:-activepieces}
    networks:
      - platform-dev-network
    restart: unless-stopped

  # ==================== Kong Gateway ====================

  kong:
    image: kong:3.9
    container_name: platform-kong-dev
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_NGINX_PROXY_CLIENT_MAX_BODY_SIZE: "100m"
      # Larger buffer for upstream status + headers (default is small). Undersized buffers can
      # cause nginx inside Kong to mis-parse Spring SSE responses and return 502 with
      # "upstream sent invalid header" when streaming /api/v1/ai-generation/chat/stream.
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: "32k"
      KONG_NGINX_PROXY_PROXY_BUFFERS: "64 32k"
      # Kong `services[].url` uses Compose service hostnames (not literal IPs). Nginx error logs
      # still print the resolved A record. Recreated containers get new IPs — cap DNS TTL in DEV
      # so upstream addresses refresh within a few seconds without restarting Kong.
      # See: https://docs.konghq.com/gateway/latest/reference/configuration/#dns_valid_ttl
      KONG_DNS_ORDER: "LAST,A,SRV,CNAME"
      KONG_DNS_VALID_TTL: "5"
      # Do not keep stale upstream IPs when Docker DNS refresh fails (e.g. backend recreate).
      KONG_DNS_STALE_TTL: "0"
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_DNS_ERROR_TTL: "1"
      # --- 客户端真实 IP（限流分桶的依据）---
      # Kong 在 nginx-edge 后面，$remote_addr 恒为 edge 容器地址，不修正的话每条
      # `limit_by: ip` 都会退化成「全平台共享一个桶」。与 K8s 侧同款配置（见
      # deploy/k8s/kong.yaml + configmap 的 KONG_TRUSTED_IPS）。
      # real_ip_recursive=off ⇒ 取 X-Forwarded-For 最右一项，即 nginx-edge 的
      # `$proxy_add_x_forwarded_for` 追加的真实来源；客户端伪造的条目都在左边，取不到。
      # ⚠️ 切勿放宽成 0.0.0.0/0——那等于允许客户端自报 IP 绕过限流。
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "off"
      # Docker bridge 网段（nginx-edge 容器）+ 环回
      KONG_TRUSTED_IPS: "172.16.0.0/12,127.0.0.1/32"
      # Environment variables used by entrypoint script for sed replacement
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - ../../../deploy/kong/kong.yml.template:/kong/kong.yml.template:ro
      - ../../../deploy/kong/docker-entrypoint-kong.sh:/kong/docker-entrypoint-kong.sh:ro
    entrypoint: ["/bin/sh", "/kong/docker-entrypoint-kong.sh"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-dev-network
    restart: unless-stopped

  # ==================== Frontend Services ====================
  # Uses Dockerfile.local — requires pre-built dist/ in each frontend project.
  # Build steps before docker compose up:
  #   1. cd frontend/admin-center && pnpm run build
  #   2. cd frontend/user-portal && pnpm run build
  #   3. cd frontend/developer-workstation && pnpm run build

  admin-center-frontend:
    build:
      context: ../../../frontend/admin-center
      dockerfile: Dockerfile.local
    image: dev-admin-center-frontend
    container_name: platform-admin-center-frontend-dev
    depends_on:
      - admin-center
      - kong
    ports:
      - "${ADMIN_CENTER_FRONTEND_PORT}:80"
    environment:
      KONG_PROXY_URL: http://kong:8000
      # Runtime config injected into /admin/config.js by docker-entrypoint.sh: shows the
      # admin "Activepieces" launcher pointing at the :8085 login bridge. Prod leaves empty.
      AP_BRIDGE_URL: ${ACTIVEPIECES_BRIDGE_PUBLIC_URL:-http://localhost:8085/__ap/bridge}
    networks:
      - platform-dev-network
    restart: unless-stopped

  user-portal-frontend:
    build:
      context: ../../../frontend/user-portal
      dockerfile: Dockerfile.local
    image: dev-user-portal-frontend
    container_name: platform-user-portal-frontend-dev
    depends_on:
      - user-portal
      - kong
    ports:
      - "${USER_PORTAL_FRONTEND_PORT}:80"
    environment:
      KONG_PROXY_URL: http://kong:8000
    networks:
      - platform-dev-network
    restart: unless-stopped

  developer-workstation-frontend:
    build:
      context: ../../../frontend/developer-workstation
      dockerfile: Dockerfile.local
    image: dev-developer-workstation-frontend
    container_name: platform-developer-workstation-frontend-dev
    depends_on:
      - developer-workstation
      - kong
    ports:
      - "${DEVELOPER_WORKSTATION_FRONTEND_PORT}:80"
    environment:
      KONG_PROXY_URL: http://kong:8000
    networks:
      - platform-dev-network
    restart: unless-stopped

  # 统一登录页 /login/（独立静态站点；与三前端同域生产环境由边缘 Nginx 反代到本容器）
  platform-login-frontend:
    build:
      context: ../../../frontend/login
      dockerfile: Dockerfile.local
    image: dev-platform-login-frontend
    container_name: platform-login-frontend-dev
    depends_on:
      - kong
    ports:
      - "${PLATFORM_LOGIN_FRONTEND_PORT:-3110}:80"
    environment:
      KONG_PROXY_URL: http://kong:8000
    networks:
      - platform-dev-network
    restart: unless-stopped

  # Guidelines portal /help/（独立静态站点；无登录；DW/Admin/Portal 共用）
  platform-help-frontend:
    build:
      context: ../../../frontend/help
      dockerfile: Dockerfile.local
    image: dev-platform-help-frontend
    container_name: platform-help-frontend-dev
    ports:
      - "${PLATFORM_HELP_FRONTEND_PORT:-3111}:80"
    networks:
      - platform-dev-network
    restart: unless-stopped

  # ==================== Edge (single-origin multi-path) ====================
  # Use this for local testing of production-like routing:
  #   http://localhost:${EDGE_FRONTEND_PORT}/admin/
  #   http://localhost:${EDGE_FRONTEND_PORT}/portal/
  #   http://localhost:${EDGE_FRONTEND_PORT}/login/
  #   http://localhost:${EDGE_FRONTEND_PORT}/help/
  #   http://localhost:${EDGE_FRONTEND_PORT}/dev/   (DEV only)
  edge-frontend:
    image: nginx:alpine
    container_name: platform-edge-frontend-dev
    depends_on:
      - kong
      - admin-center-frontend
      - user-portal-frontend
      - developer-workstation-frontend
      - platform-login-frontend
      - platform-help-frontend
    ports:
      - "${EDGE_FRONTEND_PORT:-3000}:80"
      # Superset author UI + embed now live under http://localhost:3000/bi (single FQDN
      # + path, same model as /admin /portal /dev) — no dedicated 8087/8089 ports.
      # Activepieces gateway: shared-account login bridge + reverse proxy to AP.
      - "${ACTIVEPIECES_GATEWAY_PORT:-8085}:8085"
    volumes:
      - ./nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # edge-frontend 不提供根路径静态资源，探活走 /login/（由 platform-login-frontend 提供）
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/login/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - platform-dev-network
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:
  activepieces_data:
  superset_home:   # persists load_examples SQLite data across superset container rebuilds

# Pip config for Superset image build (Nexus credentials stay in the secret file, not layers).
# build-and-deploy.ps1 sets SUPERSET_PIP_CONF_FILE before compose build.
secrets:
  pip_conf:
    file: ${SUPERSET_PIP_CONF_FILE}

networks:
  platform-dev-network:
    driver: bridge
    name: platform-dev-network
