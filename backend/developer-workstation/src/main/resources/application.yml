server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api/v1

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:5173}

# Admin Center URL for permission checking、部署与 SSO redeem（仅 DEV）
admin-center:
  url: ${ADMIN_CENTER_URL:http://localhost:8090}

# C-3 (docs/ap-integration/DECISIONS.md#d6): 调用 admin-center 时附带的可信服务密钥，
# 使 admin-center 信任转发的 X-User-Id。须与 admin-center service.internal-token 一致。
service:
  internal-token: ${SERVICE_INTERNAL_TOKEN:}

# 一键部署到管理中心：生产环境应要求 JWT（由 Kong 注入或浏览器转发）；本地/测试可关闭
developer:
  deployment:
    require-admin-authorization: ${DEVELOPER_DEPLOY_REQUIRE_ADMIN_AUTH:true}

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: developer-workstation
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_platform}
    username: ${SPRING_DATASOURCE_USERNAME:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 10 太小：设计器一个页面就并发打 3~4 个接口，叠加 Deploy / AI 的长事务后整池排队，
      # 表现是所有设计器 tab 卡满 connection-timeout(20s) 然后 500。
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  flyway:
    # schema 唯一来源 = deploy/init-scripts/00-schema（见 docs/schema-single-source-init-scripts-plan.md）。
    # Flyway 已清退（所有环境本就 SPRING_FLYWAY_ENABLED=false，迁移从未在部署中执行）；
    # 历史迁移归档于 docs/legacy-flyway-migrations/。此处固化为 false，不再依赖 env 覆盖。
    enabled: false

  jpa:
    # 关掉 OSIV：开着时 EntityManager 活到视图渲染结束，请求里任何一次出站 HTTP
    # （admin-center / workflow-engine / AI gateway，RestTemplate readTimeout=60s）
    # 都在占着连接，池子被拖垮。关掉后连接只在事务内持有。
    # 代价：@Transactional 外不能再懒加载——控制器直接返回实体时，未被 @JsonIgnore
    # 的 LAZY 关联（FunctionUnit.icon / previousVersion 等）必须在事务内就已初始化。
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:?SPRING_REDIS_PASSWORD is required}
      timeout: 5000ms
  
  messages:
    basename: i18n/messages
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# File Upload Configuration
file:
  upload:
    base-url: ${FILE_UPLOAD_BASE_URL:/api/v1/upload/files}

# Security
security:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET is required}
    expiration: ${JWT_EXPIRATION:2592000000}  # 30 days
  max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
  lock-duration-minutes: ${LOCK_DURATION_MINUTES:30}
  
  # Security Permission System Configuration
  cache:
    session-timeout-minutes: ${SECURITY_CACHE_SESSION_TIMEOUT:30}
    max-size: ${SECURITY_CACHE_MAX_SIZE:1000}
    enabled: ${SECURITY_CACHE_ENABLED:true}
    cleanup-interval-minutes: ${SECURITY_CACHE_CLEANUP_INTERVAL:15}
  
  database:
    query-timeout-seconds: ${SECURITY_DB_QUERY_TIMEOUT:30}
    retry-attempts: ${SECURITY_DB_RETRY_ATTEMPTS:2}
    retry-delay-ms: ${SECURITY_DB_RETRY_DELAY:1000}
    connection-pooling-enabled: ${SECURITY_DB_CONNECTION_POOLING:true}
  
  permission:
    resolution-strategy: ${SECURITY_PERMISSION_STRATEGY:DATABASE_FIRST}
    strict-checking: ${SECURITY_PERMISSION_STRICT:true}
    audit-logging: ${SECURITY_PERMISSION_AUDIT:true}
    max-permission-name-length: ${SECURITY_PERMISSION_MAX_NAME_LENGTH:100}
    max-role-name-length: ${SECURITY_ROLE_MAX_NAME_LENGTH:100}
  
  rate-limit:
    requests-per-minute: 100

# Workflow Engine Configuration
workflow-engine:
  url: ${WORKFLOW_ENGINE_URL:http://localhost:8081}
  enabled: true
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET is required}

# JWT Configuration (used by AuthController)
jwt:
  secret: ${JWT_SECRET:?JWT_SECRET is required}
  expiration: ${JWT_EXPIRATION:2592000000}

# Platform Security JWT Configuration (used by platform-security JwtProperties)
# developer-exchange-enabled=false 可在误部署到共享环境时关闭 SSO exchange（SIT/UAT/PROD 不应部署本服务）
platform:
  sso:
    developer-exchange-enabled: ${SSO_DEVELOPER_EXCHANGE_ENABLED:true}
    internal-token: ${SSO_INTERNAL_TOKEN:}
  security:
    jwt:
      secret: ${JWT_SECRET:?JWT_SECRET is required}
      expiration-ms: ${JWT_EXPIRATION:2592000000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
      # 服务自有 cookie 名，避免与 user-portal / admin-center 在同源下互相覆盖。
      # 列表首项是本服务写出 Cookie 的名字；其它项用于读取（兼容老客户端 / 转发场景）。
      cookie-names:
        - dw_access_token
        - up_access_token
        - access_token
      refresh-cookie-name: dw_refresh_token
      issuer: platform
      validate-issuer: false
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:?ENCRYPTION_SECRET_KEY is required}

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

# Logging
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.developer: ${LOG_LEVEL_PLATFORM:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}

# Actuator Configuration
management:
  tracing:
    sampling:
      # 100% 采样：保证每条日志都有 traceId（跨服务链路串联）
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      group:
        live:
          include: ping
        ready:
          include: db,redis
  health:
    ping:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true

# Trusted hostnames for configured outbound calls (localhost for local dev, activepieces for Docker).
# AI gateway 的 FQDN 若在集群内解析到内网地址，须一并加进来，否则启动时 SSRF 校验直接拒绝。
ssrf:
  allowed-hosts: ${SSRF_ALLOWED_HOSTS:localhost,activepieces}

# AI Generation Lock Configuration
ai-generation:
  # false 时 AiGenerationController 整个不注册(/ai-generation/** 返回 404)。
  # 须与前端 src/utils/featureFlags.ts 的 AI_GENERATION_ENABLED 保持一致(编译期常量,当前 true),
  # 否则只开前端 = 点进去全 404,只开后端 = 用户看不到入口。
  enabled: ${AI_GENERATION_ENABLED:true}
  # 集团 AI gateway(OpenAI 兼容 chat/completions)。凭证是每用户的 DSP AMToken,
  # 由前端经 X-AM-Token 头透传(或浏览器 AMToken cookie),后端不持有共享密钥。
  gateway:
    # 完整端点 URL,模型名已在路径里。未配置时每轮对话以 AI_GATEWAY_NOT_CONFIGURED 失败。
    url: ${GROUP_AI_GATEWAY_URL:}
    # 可选:body 里的 model 字段。留空则不发——URL 路径已经选定了模型。
    model: ${AI_GATEWAY_MODEL:}
    # SSE 流式调用(服务端拼回整段,上层无感)。默认 false = 集团 gateway 既有行为。
    # 置 true 是给"长请求会被掐连接"的端点用的:DeepSeek 非流式超过约 1 分钟直接 Premature EOF,
    # 而 GENERATION 阶段必然超过——短的需求/设计阶段却成功,现象很像偶发抖动。
    stream: ${AI_GATEWAY_STREAM:false}
    # 可选的静态 Bearer key,配了就顶掉每用户的 AMToken(启动时 warn 一次)。
    # 只给本地自测用:直连 DeepSeek 这类认固定 key 的 OpenAI 兼容端点。
    # 代价是 gateway 侧审计不到人,所以 dev 之外一律留空 => 回落原有的每用户 AMToken 链路。
    api-key: ${AI_GATEWAY_API_KEY:}
    # 300s: 推理模型生成 DESIGN 文档实测可达 ~230s。同时决定对话 SSE emitter 的存活时长。
    timeout-seconds: ${AI_GATEWAY_TIMEOUT_SECONDS:300}
    # AMToken 在 Cookie 中的名字,与 admin-center 的 sso.dsp.am-token-name 对齐。
    am-token-name: ${DSP_AM_TOKEN_NAME:AMToken}
  # AI Studio Copilot 改动提案的后台作业(见 AiStudioProposalJobServiceImpl):一轮 GENERATION 实测 7 分钟上下,
  # 同步 HTTP 会被 Kong 300s 读超时掐断,所以提交即返回 jobId、前端轮询。进程内注册表,重启即丢。
  studio:
    proposal-workers: ${AI_STUDIO_PROPOSAL_WORKERS:2}
    proposal-queue-size: ${AI_STUDIO_PROPOSAL_QUEUE_SIZE:8}
    proposal-retention-minutes: ${AI_STUDIO_PROPOSAL_RETENTION_MINUTES:30}
    proposal-max-runtime-minutes: ${AI_STUDIO_PROPOSAL_MAX_RUNTIME_MINUTES:30}
    proposal-max-jobs: ${AI_STUDIO_PROPOSAL_MAX_JOBS:200}
  lock:
    ttl-seconds: ${AI_GENERATION_LOCK_TTL:1800}
    force-unlock-timeout-seconds: ${AI_GENERATION_FORCE_UNLOCK_TIMEOUT:60}
  context:
    max-size-bytes: ${AI_GENERATION_CONTEXT_MAX_SIZE:102400}
