server:
  port: ${SERVER_PORT:8081}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

spring:
  application:
    name: workflow-engine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true

  # Database Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_platform}
    username: ${SPRING_DATASOURCE_USERNAME:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:?SPRING_REDIS_PASSWORD is required}
      timeout: 5000ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: workflow-engine
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.platform.*

# Flowable Configuration
flowable:
  # For development: create schema automatically
  # For production: set to false and use manual schema initialization
  database-schema-update: ${FLOWABLE_SCHEMA_UPDATE:false}
  async-executor-activate: true
  history-level: full
  dmn:
    enabled: true
    resource-suffixes: .dmn
    deployment-name: dmn-deployment
    strict-mode: false

# Admin Center Configuration
admin-center:
  url: ${ADMIN_CENTER_URL:http://localhost:8090}

# User Portal Configuration
user-portal:
  url: ${USER_PORTAL_URL:http://localhost:8082}

# Shared with user-portal portal.internal.api-token (standing-delegation assigned-to query)
portal:
  internal:
    api-token: ${PORTAL_INTERNAL_API_TOKEN:}

# File service base URL (for converting relative file paths to absolute URLs)
file-service:
  base-url: ${FILE_SERVICE_BASE_URL:http://localhost:8083}

# Activepieces (AP) runtime — single shared instance per environment.
# Service tasks store only ap:flowId; the sync webhook URL is built as
# <webhook-base-url>/api/v1/webhooks/<flowId>/sync at runtime.
service-task:
  webhook-base-url: ${ACTIVEPIECES_WEBHOOK_BASE_URL:http://localhost:8086}
  # Q7 部署期解析：admin-center /automation/flows/resolve。空 = 关闭（部署按原 ap:flowId 继续）。
  flow-resolve-url: ${ACTIVEPIECES_FLOW_RESOLVE_URL:}

# C-3 服务间共享密钥（与 admin-center 的 SERVICE_INTERNAL_TOKEN 同值）；flow-resolve 调用凭此过门禁
service:
  internal-token: ${SERVICE_INTERNAL_TOKEN:}

# 本地/开发联调测试账号（默认关闭 fail-closed；生产严禁设置这两个变量）
# accounts 格式：user1:pass1,user2:pass2 —— 仅在 Redis 无该用户口令时回退匹配
workflow:
  security:
    test-users:
      enabled: ${WORKFLOW_TEST_USERS_ENABLED:false}
      accounts: ${WORKFLOW_TEST_USERS:}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:?JWT_SECRET is required}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Platform Configuration
platform:
  security:
    jwt:
      secret: ${JWT_SECRET:?JWT_SECRET is required}
      expiration-ms: ${JWT_EXPIRATION:86400000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
      # 引擎不签发 cookie，但接收三端代理过来的 REST / WebSocket 请求；
      # 需同时识别 up_/ac_/dw_ 前缀的 access cookie，避免按浏览器随机选中的同源 cookie 鉴权失败。
      cookie-names:
        - up_access_token
        - dw_access_token
        - ac_access_token
        - access_token
      refresh-cookie-name: access_token
      issuer: platform
      validate-issuer: false
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:?ENCRYPTION_SECRET_KEY is required}
  workflow-engine:
    callback-base-url: ${WORKFLOW_ENGINE_CALLBACK_BASE_URL:http://localhost:8081}

# Actuator Configuration
management:
  tracing:
    sampling:
      # 100% 采样：保证每条日志都有 traceId（跨服务链路串联）
      probability: 1.0
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      group:
        live:
          include: ping
        ready:
          include: db,redis
  health:
    ping:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true

# Logging Configuration
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.platform: ${LOG_LEVEL_PLATFORM:DEBUG}
    org.flowable: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
  pattern:
    # [traceId,spanId] 由 Micrometer Tracing 填充，跨服务串联同一请求链路
    console: "%d{yyyy-MM-dd HH:mm:ss} [workflow-engine] [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    com.platform: DEBUG
    org.hibernate.SQL: DEBUG

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    com.platform: INFO

management:
  endpoint:
    health:
      show-details: never
