server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /api/v1/admin

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Application Configuration (platform-common)
app:
  database:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_platform}
    username: ${SPRING_DATASOURCE_USERNAME:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    driver-class-name: org.postgresql.Driver
    max-pool-size: 20
    min-idle: 5
    connection-timeout: 20000
    
  security:
    jwt-secret-key: ${JWT_SECRET:?JWT_SECRET is required}
    jwt-expiration-ms: ${JWT_EXPIRATION:86400000}
    jwt-refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
    password:
      min-length: 8
      max-length: 128
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special: true
      history-count: 5
      expiry-days: 90
    login:
      max-failed-attempts: 5
      lockout-duration-minutes: 30
    session:
      timeout-minutes: 30
      max-concurrent-sessions: 3
      
  api:
    workflow-engine-url: ${WORKFLOW_ENGINE_URL:http://localhost:8081}
    admin-center-url: ${ADMIN_CENTER_URL:http://localhost:8090}
    timeout-seconds: 30
    max-retries: 3
    
  monitoring:
    enabled: true
    log-level: ${LOG_LEVEL:INFO}
    metrics-enabled: true
    health-check-interval-seconds: 60
    
  cache:
    redis-host: ${SPRING_REDIS_HOST:localhost}
    redis-port: ${SPRING_REDIS_PORT:6379}
    redis-password: ${SPRING_REDIS_PASSWORD:?SPRING_REDIS_PASSWORD is required}
    redis-database: 1
    user-ttl-minutes: 30
    permission-ttl-minutes: 60
    dictionary-ttl-minutes: 120
    
  messaging:
    kafka-bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    kafka-group-id: admin-center
    enabled: false
    
  workflow:
    engine-url: ${WORKFLOW_ENGINE_URL:http://localhost:8081}
    enabled: true
    timeout-seconds: 30

# 编排调用 user-portal 内部清理 API（须与门户 portal.internal.api-token 一致）
user-portal:
  base-url: ${USER_PORTAL_BASE_URL:http://localhost:8082/api/portal}
  internal-api-token: ${PORTAL_INTERNAL_API_TOKEN:}

# C-3 (docs/ap-integration/DECISIONS.md#d6): 可信一方服务共享密钥。仅当请求携带此 token 时，
# admin-center 才信任裸 X-User-Id/X-Username 铸身份。Activepieces 不持有此密钥。
# 未配置 → header 身份兜底整体禁用（fail-closed）。须与 DW/user-portal 的同名密钥一致。
service:
  internal-token: ${SERVICE_INTERNAL_TOKEN:}

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: admin-center
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_platform}
    username: ${SPRING_DATASOURCE_USERNAME:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  flyway:
    # schema 唯一来源 = deploy/init-scripts/00-schema（见 docs/schema-single-source-init-scripts-plan.md）。
    # Flyway 已清退（所有环境本就 SPRING_FLYWAY_ENABLED=false，迁移从未在部署中执行）；
    # 历史迁移归档于 docs/legacy-flyway-migrations/。此处固化为 false，不再依赖 env 覆盖。
    enabled: false
  
  # 禁用静态资源处理，避免与 API 路由冲突
  web:
    resources:
      add-mappings: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:?SPRING_REDIS_PASSWORD is required}
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: admin-center
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

  messages:
    basename: i18n/messages
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# Security Configuration
security:
  password:
    min-length: 8
    max-length: 128
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special: true
    history-count: 5
    expiry-days: 90
  
  login:
    max-failed-attempts: 5
    lockout-duration-minutes: 30
  
  session:
    timeout-minutes: 30
    max-concurrent-sessions: 3

# Logging Configuration
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.admin: ${LOG_LEVEL_PLATFORM:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
  file:
    name: logs/admin-center.log
  pattern:
    # [traceId,spanId] 由 Micrometer Tracing 填充，跨服务串联同一请求链路
    console: "%d{yyyy-MM-dd HH:mm:ss} [admin-center] [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [admin-center] [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# Actuator Configuration
management:
  tracing:
    sampling:
      # 100% 采样：保证每条日志都有 traceId（跨服务链路串联）。导出到追踪后端的采样可另配。
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      group:
        live:
          include: ping
        ready:
          include: db,redis
  health:
    ping:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha

# Application Configuration
admin:
  # 登录开关：developer-bypass-role-check 仅本地联调用，开启后跳过 SYS_ADMIN/AUDITOR 角色校验。生产严禁开启。
  auth:
    developer-bypass-role-check: ${ADMIN_DEV_BYPASS_ROLE_CHECK:false}
  audit:
    enabled: true
    retention-days: 365
  
  notification:
    email:
      enabled: true
    sms:
      enabled: false
    
  cache:
    user-ttl-minutes: 30
    permission-ttl-minutes: 60
    dictionary-ttl-minutes: 120

# Workflow Engine Configuration
workflow-engine:
  url: ${WORKFLOW_ENGINE_URL:http://localhost:8081}
  enabled: true

# BI Management Configuration
bi:
  superset:
    host: ${SUPERSET_HOST:http://localhost:8088}
    public-host: ${SUPERSET_PUBLIC_HOST:http://localhost:8088}
    db-schema: ${SUPERSET_DB_SCHEMA:public}
    admin-username: ${BI_SUPERSET_USERNAME}
    admin-password: ${BI_SUPERSET_PASSWORD}
    guest-token-timeout-seconds: 30
    # Superset AUTH_ROLE_ADMIN. Mapped users holding it bypass the per-dashboard role filter (embed path).
    admin-role-name: Admin
  sync:
    cron: ${BI_SYNC_CRON:0 0 */6 * * ?}
    enabled: ${BI_SYNC_ENABLED:true}

# Activepieces integration (community edition + gateway login bridge, per-user identity).
# bridge.enabled is OFF by default — prod runs AP as runtime only (no UI login).
# Non-prod enables the bridge so the :8085 gateway can mint per-user AP tokens.
service-task:
  internal-url: ${ACTIVEPIECES_INTERNAL_URL:http://localhost:8086}
  bridge:
    enabled: ${ACTIVEPIECES_BRIDGE_ENABLED:false}
    # 桥页公网地址（浏览器侧）。/launch 在其后附 #nonce=<票> 整页跳转，AP 域无需平台 JWT cookie。
    # k8s：AP 网关主机，例如 http://hermes-workflow-activepieces.<域>/__ap/bridge；留空 → /launch 返回 502。
    public-url: ${AP_BRIDGE_URL:}
    nonce-ttl-seconds: ${ACTIVEPIECES_BRIDGE_NONCE_TTL:60}
  # Per-user provisioning（L7 审计到人）——AP 身份的唯一路径，无共享账号、无回退开关：
  # 所有 AP 调用（登录桥 /internal/ap/*、flow/piece 的导入删除启停）都按当前操作人换取
  # 其专属 AP token，flow.ownerId 与 AP 审计因此落到真实的人。
  # signing-key-id / private-key 来自一次性 POST /v1/signing-keys（平台 admin）；
  # 未配置时 AP 调用直接失败（ACTIVEPIECES_API_ERROR），不会退回任何共享身份。
  managed:
    signing-key-id: ${ACTIVEPIECES_MANAGED_SIGNING_KEY_ID:}
    private-key: ${ACTIVEPIECES_MANAGED_PRIVATE_KEY:}
    # Public / 历史共享 workspace 的 AP externalProjectId。DW 的团队 workspace 各自映射到
    # team-project-external-id-prefix + <虚拟组 id>，故此值只服务 Public（存量 flow 原地不动）。
    project-external-id: ${ACTIVEPIECES_MANAGED_PROJECT_EXTERNAL_ID:hermes-main}
    token-ttl-seconds: ${ACTIVEPIECES_MANAGED_TOKEN_TTL:120}
    # Automation workspace 映射（DW 开发组 → AP project）。默认值与 DW 的 DevGroupConstants
    # 及种子脚本一致，正常环境无需覆盖。
    public-group-id: vg-dev-public
    team-project-external-id-prefix: hermes-dg-
    # Public workspace 里非 SYS_ADMIN 用的 AP 角色：Viewer 只有 READ_*，AP 路由层据此真的拒写。
    read-only-project-role: Viewer
    # 影子用户角色：平台级 ADMIN|MEMBER，project 级 Admin|Editor|Viewer（逐字对应 project_role.name）。
    # 默认全权——从 admin center 进入的人要能用平台级页面；每次握手会同步既有影子用户的角色。
    platform-role: ${ACTIVEPIECES_MANAGED_PLATFORM_ROLE:ADMIN}
    project-role: ${ACTIVEPIECES_MANAGED_PROJECT_ROLE:Admin}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:?JWT_SECRET is required}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Platform Security JWT Configuration (used by platform-security JwtProperties)
platform:
  security:
    jwt:
      secret: ${JWT_SECRET:?JWT_SECRET is required}
      expiration-ms: ${JWT_EXPIRATION:86400000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
      # 服务自有 cookie 名，避免与 user-portal / developer-workstation 在同源下互相覆盖。
      # 列表首项是本服务写出 Cookie 的名字；其它项用于读取（兼容老客户端 / 转发场景）。
      #
      # dw_access_token 为只读项：Developer Workstation 页面（FU → Service Task）会直接调用
      # admin-center 的 /internal/ap/* 登录桥端点，而浏览器此时持有的是 DW 签发的平台 JWT
      # cookie。不列入则 JwtAuthenticationFilter 取不到 token → 无认证主体 → /launch 返回 401。
      # 这与 C-3（DECISIONS.md#d6）不冲突：C-3 拒绝的是无密码学凭据的裸 X-User-Id 头，
      # 这里读取并验签的是平台 JWT，属于真实认证；workflow-engine-core 早已同时接受
      # up_/dw_/ac_ 三种 cookie 名，此处沿用同一模式。
      cookie-names:
        - ac_access_token
        - dw_access_token
        - access_token
      refresh-cookie-name: ac_refresh_token
      # Cookie Domain. Empty (dev, single host) -> host-only. k8s non-prod sets it to
      # .<BASE_DOMAIN> so the platform JWT is shared across sub-domains (AP/Superset gateways).
      cookie-domain: ${JWT_COOKIE_DOMAIN:}
      issuer: platform
      validate-issuer: false
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:?ENCRYPTION_SECRET_KEY is required}
  # 统一登录页 /login：签发 SSO code；子系统凭 SSO_INTERNAL_TOKEN 调用 /internal/sso/redeem
  sso:
    internal-token: ${SSO_INTERNAL_TOKEN:}
    code-ttl-seconds: ${SSO_CODE_TTL_SECONDS:300}
    # DSP 免密（Passwordless）：浏览器取 AMToken → 后端用 AMToken 调 translator 换 E2E/JWT → 解析 claims 定位用户。
    # 所有真实地址/密钥仅经 ${ENV} 注入；本地 mock 用 mock-dsp 桩。默认关闭。
    dsp:
      enabled: ${DSP_SSO_ENABLED:true}
      authenticate-url: ${DSP_AUTHENTICATE_URL:}
      translator-url: ${DSP_TRANSLATOR_URL:}
      manifest-locations: ${DSP_MANIFEST_LOCATIONS:}
      client-id: ${DSP_CLIENT_ID:}
      client-secret: ${DSP_CLIENT_SECRET:}
      accept-api-version: ${DSP_ACCEPT_API_VERSION:protocol=1.0,resource=1.0}
      am-token-name: ${DSP_AM_TOKEN_NAME:AMToken}
      e2e-header-name: ${DSP_E2E_HEADER_NAME:X-HSBC-E2E-Trust-Token}
      input-token-type: ${DSP_INPUT_TOKEN_TYPE:SSOTOKEN}
      output-token-type: ${DSP_OUTPUT_TOKEN_TYPE:JWT}
      accept-gateway-e2e-token: ${DSP_ACCEPT_GATEWAY_E2E_TOKEN:false}
      employee-id-claim-names: ${DSP_EMPLOYEE_ID_CLAIMS:employeeID,employeeNumber,hsbcStaffId,sub}
      username-claim-names: ${DSP_USERNAME_CLAIMS:uid,preferred_username,samAccountName,sub}
    clients:
      admin:
        enabled: true
        redirect-uri-prefixes:
          - ${SSO_REDIRECT_ADMIN_PREFIX:http://localhost:3000/admin/sso/callback}
          - ${SSO_REDIRECT_ADMIN_HTTP_PREFIX:http://localhost:3000/admin/sso/callback}
          - http://localhost:3000/admin/sso/callback
          # Edge on 127.0.0.1 (browser Origin / redirect_uri differ from localhost)
          - http://127.0.0.1:3000/admin/sso/callback
      portal:
        enabled: true
        redirect-uri-prefixes:
          - ${SSO_REDIRECT_PORTAL_PREFIX:http://localhost:3000/portal/sso/callback}
          - ${SSO_REDIRECT_PORTAL_HTTP_PREFIX:http://localhost:3000/portal/sso/callback}
          - http://localhost:3001/portal/sso/callback
          - http://127.0.0.1:3000/portal/sso/callback
          - http://127.0.0.1:3001/portal/sso/callback
      developer-workstation:
        enabled: ${SSO_CLIENT_DEVELOPER_ENABLED:true}
        redirect-uri-prefixes:
          - ${SSO_REDIRECT_DW_PREFIX:http://localhost:3000/dev/sso/callback}
          - ${SSO_REDIRECT_DW_HTTP_PREFIX:http://localhost:3000/dev/sso/callback}
          - http://localhost:3002/dev/sso/callback
          - http://127.0.0.1:3000/dev/sso/callback
          - http://127.0.0.1:3102/dev/sso/callback

# LDAP 为用户画像权威源：定期对目标 AD 组成员对账 + 登录 JIT 回写 sys_users。
# 所有连接参数/密钥仅经 ${ENV} 注入，严禁硬编码（见 security-guard）。默认关闭；本地用 OpenLDAP mock 验证。
# 属性名默认 HSBC AD 命名，本地标准 schema(OpenLDAP/inetOrgPerson) 可经 env 覆盖。
ldap:
  enabled: ${LDAP_ENABLED:true}
  provider-url: ${LDAP_PROVIDER_URL:}
  base-dn: ${LDAP_BASE_DN:}
  bind-dn: ${LDAP_BIND_DN:}
  bind-password: ${LDAP_BIND_PASSWORD:}
  tls: ${LDAP_TLS:true}
  # 明文 ldap:// 且 tls=false 时必须显式开启，否则启动 fail-fast（防生产误配明文传输口令）
  allow-insecure: ${LDAP_ALLOW_INSECURE:false}
  connect-timeout-ms: ${LDAP_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${LDAP_READ_TIMEOUT_MS:10000}
  page-size: ${LDAP_PAGE_SIZE:500}
  max-entries: ${LDAP_MAX_ENTRIES:0}
  user-search-filter: ${LDAP_USER_SEARCH_FILTER:(|(objectclass=userproxy)(objectclass=user))}
  sync-enabled: ${LDAP_SYNC_ENABLED:false}
  sync-cron: ${LDAP_SYNC_CRON:0 0 */2 * * ?}
  keystore-path: ${LDAP_KEYSTORE_PATH:}
  keystore-password: ${LDAP_KEYSTORE_PASSWORD:}
  # LDAP 属性名映射（默认 HSBC AD；本地 OpenLDAP 可经 env 覆盖为标准 schema 属性名）
  attributes:
    employee-id: ${LDAP_ATTR_EMPLOYEE_ID:employeeID}
    uid: ${LDAP_ATTR_UID:uid}
    sam-account-name: ${LDAP_ATTR_SAM_ACCOUNT_NAME:hsbc-ad-SAMAccountName}
    cn: ${LDAP_ATTR_CN:cn}
    display-name: ${LDAP_ATTR_DISPLAY_NAME:displayName}
    given-name: ${LDAP_ATTR_GIVEN_NAME:givenName}
    sn: ${LDAP_ATTR_SN:sn}
    mail: ${LDAP_ATTR_MAIL:mail}
    telephone-number: ${LDAP_ATTR_TELEPHONE:telephoneNumber}
    intl-tel-number: ${LDAP_ATTR_INTL_TEL:hsbc-ad-IntlTelNumber}
    title: ${LDAP_ATTR_TITLE:title}
    work-role: ${LDAP_ATTR_WORK_ROLE:hsbc-ad-WorkRole}
    postal-address: ${LDAP_ATTR_POSTAL_ADDRESS:postalAddress}
    line-manager-name: ${LDAP_ATTR_LINE_MANAGER_NAME:hsbc-ad-LineManagerName}
    auth-manager-name: ${LDAP_ATTR_AUTH_MANAGER_NAME:hsbc-ad-AuthManagerName}
    line-manager-id: ${LDAP_ATTR_LINE_MANAGER_ID:hsbc-ad-LineManagerID}
    manager-emp-id: ${LDAP_ATTR_MANAGER_EMP_ID:hsbc-ad-managerEmpId}
    auth-manager-emp-id: ${LDAP_ATTR_AUTH_MANAGER_EMP_ID:hsbc-ad-AuthManagerEmpId}
    lockout-time: ${LDAP_ATTR_LOCKOUT_TIME:lockoutTime}
    when-changed: ${LDAP_ATTR_WHEN_CHANGED:whenChanged}
  # Hermes AD 组同步：环境名（DEV/UAT/PPD/PRD），用于构建 AD 组名
  hermes-env: ${LDAP_HERMES_ENV:}
  # AD 组→角色/虚拟组同步配置
  group-sync:
    env: ${LDAP_GROUP_ENV:}
    search-base-dn: ${LDAP_GROUP_SEARCH_BASE_DN:}
    groups: ${LDAP_HERMES_GROUP_SYNC_GROUPS:${LDAP_GROUP_GROUPS:}}
    roles: ${LDAP_HERMES_GROUP_SYNC_ROLES:${LDAP_GROUP_ROLES:}}
    pattern: ${LDAP_HERMES_GROUP_SYNC_PATTERN:${LDAP_GROUP_PATTERN:Infodir-Hermes-Default-{env}-{role}}}
    batch-size: ${LDAP_HERMES_GROUP_SYNC_BATCH_SIZE:${LDAP_GROUP_BATCH_SIZE:20}}
